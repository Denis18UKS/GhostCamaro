name: Fabric 1.20.1
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GhostCamaro-Fabric-1.20.1-V7
          path: build/libs/GhostCamaro-Fabric-1.20.1-V7.jar
          if-no-files-found: error
      - name: Dedicated Fabric vehicle GameTest
        timeout-minutes: 8
        run: |
          bash gradlew -PdedicatedSmoke runVehicleServer --stacktrace
          test -s run/dedicated/reports/gametest.xml
      - name: In-game client and integrated-server check
        timeout-minutes: 16
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" bash gradlew -PvehicleSmoke runClient --stacktrace
          test -f run/evidence/PASS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: in-game-evidence
          path: |
            run/dedicated/reports/gametest.xml
            run/evidence
            run/logs/latest.log
            run/crash-reports
      - name: Open master project in Blockbench
        timeout-minutes: 6
        run: |
          npm install --prefix "$RUNNER_TEMP/bb-test" playwright@1.55.0
          "$RUNNER_TEMP/bb-test/node_modules/.bin/playwright" install chromium
          NODE_PATH="$RUNNER_TEMP/bb-test/node_modules" node tools/v7/blockbench.cjs
  dedicated-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash tools/v7/dedicated.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dedicated-network
          path: |
            run/network-server/launch.log
            run/evidence/dedicated-client.txt
