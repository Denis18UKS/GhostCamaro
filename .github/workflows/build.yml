name: Fabric 1.20.1
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GhostCamaro-Fabric-1.20.1-V6.1
          path: build/libs/GhostCamaro-Fabric-1.20.1-V6.1.jar
          if-no-files-found: error
      - name: Dedicated Fabric vehicle GameTest
        timeout-minutes: 8
        run: |
          bash gradlew -PdedicatedSmoke runVehicleServer --stacktrace
          test -s run/dedicated/reports/gametest.xml
      - name: In-game client and integrated-server check
        timeout-minutes: 16
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" bash gradlew -PvehicleSmoke runClient --stacktrace
          test -f run/evidence/PASS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: in-game-evidence
          path: |
            run/dedicated/reports/gametest.xml
            run/evidence
            run/logs/latest.log
            run/crash-reports
