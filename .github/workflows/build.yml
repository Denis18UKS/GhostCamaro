name: Fabric 1.20.1
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GhostCamaro-Fabric-1.20.1-NEXT.1
          path: build/libs/GhostCamaro-Fabric-1.20.1-NEXT.1.jar
          if-no-files-found: error
      - name: Dedicated Fabric vehicle GameTest
        timeout-minutes: 8
        run: |
          bash gradlew -PdedicatedSmoke runVehicleServer --stacktrace
          test -s run/dedicated/reports/gametest.xml
      - name: In-game client and integrated-server check
        timeout-minutes: 16
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" bash gradlew -PvehicleSmoke runClient --stacktrace
          test -f run/evidence/PASS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: in-game-evidence
          path: |
            run/dedicated/reports/gametest.xml
            run/evidence
            run/logs/latest.log
            run/crash-reports
      - name: Open master project in Blockbench
        timeout-minutes: 6
        run: |
          npm install --prefix "$RUNNER_TEMP/bb-test" playwright@1.55.0
          "$RUNNER_TEMP/bb-test/node_modules/.bin/playwright" install chromium
          NODE_PATH="$RUNNER_TEMP/bb-test/node_modules" node tools/v7/blockbench.cjs
  dedicated-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash tools/v7/dedicated.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dedicated-network
          path: |
            run/network-server/launch.log
            run/evidence/dedicated-client.txt
  distribution:
    needs: [build, dedicated-network]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          curl -fsSL --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/blender-4.3.2-linux-x64:$PATH"
          python3 tools/port.py
          python3 tools/next/cargo.py
          blender -b -t 2 --python-exit-code 1 --python tools/v7/blender_export.py
          blender -b -t 2 --python-exit-code 1 --python tools/next/scenery.py | tee /tmp/export-checks.log
          test "$(grep -c '^ROUNDTRIP ' /tmp/export-checks.log)" = 54
      - uses: actions/download-artifact@v4
        with:
          name: GhostCamaro-Fabric-1.20.1-NEXT.1
          path: build/next/Minecraft
      - uses: actions/download-artifact@v4
        with:
          name: in-game-evidence
          path: build/next/Checks/Minecraft
      - uses: actions/download-artifact@v4
        with:
          name: dedicated-network
          path: build/next/Checks/Network
      - name: Open prop projects in Blockbench
        timeout-minutes: 12
        run: |
          npm install --prefix "$RUNNER_TEMP/bb-test" playwright@1.55.0
          "$RUNNER_TEMP/bb-test/node_modules/.bin/playwright" install chromium
          NODE_PATH="$RUNNER_TEMP/bb-test/node_modules" node tools/next/editor-check.cjs
      - run: python3 tools/next/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: GhostCamaro-NEXT-FULL-PROJECT
          path: build/next/
          if-no-files-found: error
